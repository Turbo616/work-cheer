<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>上班鼓励器</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div class="brand"><span class="logo">薪</span><div>上班鼓励器<small>每一份努力，都有回响</small></div></div><button id="settings" aria-label="打开设置">设置</button></header>
<div class="date" id="date"></div><section class="income"><div class="status"><span class="dot"></span><span id="status"></span></div><p>今日已赚</p><div class="money"><span>¥</span><strong id="earned">0.0000</strong></div><div class="speed">每一秒，都在向生活靠近 <b id="speed"></b></div></section>
<section class="countdown"><span>距离下班</span><strong id="countdown"></strong><div class="track"><div id="progress"></div></div><div class="progress-label"><span id="percent"></span><span id="hours"></span></div></section>
<section class="month"><div><span>本月预计累计</span><small>按当前作息估算，非实际工资单</small></div><strong id="month"></strong></section>
<blockquote id="quote">慢慢来，你的努力正在变成生活的底气。</blockquote><footer><label><input type="checkbox" id="pin"> 窗口置顶</label><span>本机保存 · 离线可用</span></footer><p id="notice" role="status"></p>
<dialog id="dialog"><form id="form"><div class="dialog-head"><h2>把努力，算得明明白白</h2><button type="button" id="close" aria-label="关闭设置">×</button></div><p class="muted">填写你的工资与作息，设置仅保存在这台设备。</p><div class="fields">
<label>月薪（元）<input name="salary" type="number" min="0" max="1000000000" required step="0.01"></label><label>月计薪天数<input name="days" type="number" min="1" max="31" step="0.01" required></label>
<label>上班时间<input name="start" type="time" required></label><label>下班时间<input name="end" type="time" required></label><label>休息开始<input name="breakStart" type="time" required></label><label>休息结束<input name="breakEnd" type="time" required></label>
<label>工作日下班后时薪（元）<input name="overtime" type="number" min="0" max="1000000000" step="0.01" required></label><label>休息日时薪（元）<input name="weekendRate" type="number" min="0" max="1000000000" step="0.01" required></label></div><fieldset><legend>正常工作日</legend><div id="weekdays"></div></fieldset>
<label>本月金额调整（元，补入额外收入）<input name="monthBase" type="number" min="0" max="1000000000" step="0.01" required></label><p class="muted">不计休息时段；休息日仅按当天时薪估算。历史工作日按当前作息重算，不自动记录历史加班或请假。暂不支持跨夜班。</p><p id="error" role="alert"></p><button class="primary" type="submit">保存设置</button></form></dialog></main><script src="core.js"></script><script src="renderer.js"></script></body></html>
